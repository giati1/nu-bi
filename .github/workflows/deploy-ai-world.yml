name: Deploy NOMI World
on:
  push:
    branches: [codex/ai-world]
  workflow_dispatch:
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
      - run: npm ci
      - run: npm run world:test
      - run: npm run typecheck
      - name: Prepare local build database before parallel page workers
        run: npm run db:init
      - run: npm run cf:build
      - name: Add the world snapshot table without changing existing tables
        run: npx wrangler d1 execute nu-bi --remote --file db/migrations/021_ai_world.sql
      - name: Deploy the verified bundle
        run: npx wrangler deploy
