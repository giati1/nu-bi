name: Deploy Cloudflare Production

on:
  push:
    branches:
      - main
    paths:
      - "app/giati/**"
      - "public/portfolio/**"
      - "app/page.tsx"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-production.yml"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to deploy to production
        required: true
        default: main
        type: string

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify adapter patch
        run: node scripts/patch-opennext-cloudflare.mjs --verify

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js app
        run: npm run build

      - name: Build Cloudflare worker bundle
        run: npm run cf:build

      - name: Deploy production Worker
        run: npm run cf:deploy
